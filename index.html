<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#063B80">
    <title>كيان البريق اللامع | AL-BARIQ AL-LAMIE ENTITY</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Cormorant+Garamond:wght@400;500;600;700&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* =========================================
           CSS VARIABLES & THEMES
           ========================================= */
        :root {
            --primary-blue: #063B80;
            --dark-blue: #00245A;
            --bright-blue: #0878D1;

            --gold: #F5B82E;
            --dark-gold: #D89516;

            --white: #FFFFFF;
            --dark-text: #1A1A1A;

            --bg-primary: #F8FAFD;
            --bg-secondary: #FFFFFF;
            --bg-tertiary: #EEF3FA;
            --bg-dark: var(--dark-blue);
            --bg-dark-secondary: var(--primary-blue);

            --text-primary: var(--dark-text);
            --text-secondary: #4A5568;
            --text-light: #718096;
            --text-on-dark: #FFFFFF;
            --text-on-dark-secondary: #C9D6E8;

            --brand-gold: var(--gold);
            --brand-orange: var(--dark-gold);
            --brand-accent: var(--bright-blue);
            --brand-teal: var(--primary-blue);
            --brand-red: #8B1A1A;

            --accent-gold: var(--gold);
            --accent-gold-hover: var(--dark-gold);
            --accent-gold-light: rgba(245, 184, 46, 0.12);
            --accent-gold-border: rgba(245, 184, 46, 0.35);

            --border-color: #DDE6F2;
            --border-light: #EDF2F9;

            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 8px 32px rgba(6, 59, 128, 0.08);
            --glass-blur: blur(24px) saturate(180%);

            --header-bg: rgba(248, 250, 253, 0.75);
            --header-bg-scrolled: rgba(248, 250, 253, 0.95);

            --card-shadow: 0 4px 24px rgba(6, 59, 128, 0.07);
            --card-shadow-hover: 0 24px 60px rgba(6, 59, 128, 0.18);

            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition-slow: all 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);

            --header-h: 82px;
        }

        [data-theme="dark"] {
            --bg-primary: #04162E;
            --bg-secondary: #062347;
            --bg-tertiary: #0A2E5C;
            --bg-dark: #02101F;
            --bg-dark-secondary: #04162E;

            --text-primary: #F5F8FC;
            --text-secondary: #B8C7DC;
            --text-light: #7A8CA6;
            --text-on-dark: #FFFFFF;
            --text-on-dark-secondary: #C9D6E8;

            --accent-gold: var(--gold);
            --accent-gold-hover: #FFD15C;
            --accent-gold-light: rgba(245, 184, 46, 0.14);
            --accent-gold-border: rgba(245, 184, 46, 0.4);

            --border-color: #0F3B6B;
            --border-light: #0A2E5C;

            --glass-bg: rgba(6, 35, 71, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);

            --header-bg: rgba(4, 22, 46, 0.75);
            --header-bg-scrolled: rgba(4, 22, 46, 0.95);

            --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
            --card-shadow-hover: 0 24px 60px rgba(0, 0, 0, 0.55);
        }

        /* =========================================
           GLOBAL RESET & TYPOGRAPHY
           ========================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Cairo', 'Lato', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            transition: background-color 0.5s ease, color 0.5s ease;
            overflow-x: hidden;
            padding-top: var(--header-h);
            -webkit-tap-highlight-color: transparent;
        }

        body[dir="ltr"] { font-family: 'Lato', 'Cairo', sans-serif; }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Cormorant Garamond', 'Cairo', serif;
            font-weight: 700;
            line-height: 1.2;
            color: var(--text-primary);
        }

        body[dir="ltr"] h1, body[dir="ltr"] h2, body[dir="ltr"] h3, body[dir="ltr"] h4 {
            font-family: 'Cormorant Garamond', serif;
        }

        a { text-decoration: none; color: inherit; transition: var(--transition); }
        ul { list-style: none; }
        img { max-width: 100%; height: auto; display: block; }

        .container {
            max-width: 1360px;
            margin: 0 auto;
            padding: 0 2.5rem;
            width: 100%;
        }

        @media (max-width: 768px) { .container { padding: 0 1.25rem; } }
        @media (max-width: 480px) { .container { padding: 0 1rem; } }

        /* =========================================
           UTILITIES
           ========================================= */
        .section-padding { padding: 8rem 0; }
        @media (max-width: 768px) { .section-padding { padding: 3.5rem 0; } }
        @media (max-width: 480px) { .section-padding { padding: 3rem 0; } }

        .gold-line {
            width: 70px; height: 4px;
            background: linear-gradient(90deg, var(--gold), var(--dark-gold));
            margin-bottom: 1.5rem;
            border-radius: 4px;
            transition: width 0.6s ease;
        }

        .section-title {
            font-size: clamp(1.6rem, 4.5vw, 3.5rem);
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            font-weight: 800;
            line-height: 1.25;
        }

        .section-subtitle {
            font-size: clamp(0.85rem, 1.4vw, 1.1rem);
            color: var(--text-secondary);
            margin-bottom: 3.5rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        @media (max-width: 768px) {
            .section-subtitle { margin-bottom: 2.2rem; }
        }

        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 0.6rem; padding: 1rem 2.2rem;
            font-size: 0.9rem; font-weight: 700;
            border: 2px solid transparent; cursor: pointer;
            transition: var(--transition); text-align: center;
            border-radius: 50px; letter-spacing: 0.5px;
            position: relative; overflow: hidden;
            font-family: 'Cairo', sans-serif;
        }

        @media (max-width: 768px) {
            .btn { padding: 0.85rem 1.6rem; font-size: 0.85rem; }
        }

        .btn i { transition: transform 0.3s ease; }
        .btn:hover i { transform: translateX(-4px); }
        body[dir="ltr"] .btn:hover i { transform: translateX(4px); }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-blue), var(--bright-blue));
            color: #FFFFFF;
            box-shadow: 0 6px 20px rgba(8, 120, 209, 0.3);
        }
        .btn-primary::before {
            content: ''; position: absolute; top: 50%; left: 50%;
            width: 0; height: 0; background: rgba(255, 255, 255, 0.2);
            border-radius: 50%; transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }
        .btn-primary:hover::before { width: 300px; height: 300px; }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(8, 120, 209, 0.45);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-primary);
            border-color: var(--border-color);
        }
        .btn-outline:hover {
            border-color: var(--gold);
            color: var(--primary-blue);
            transform: translateY(-3px);
            background-color: var(--accent-gold-light);
            box-shadow: 0 8px 25px rgba(245, 184, 46, 0.25);
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--gold), var(--dark-gold));
            color: var(--dark-blue);
            box-shadow: 0 6px 20px rgba(245, 184, 46, 0.35);
        }
        .btn-gold:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(245, 184, 46, 0.5);
        }

        .btn-outline-light {
            background-color: transparent;
            color: #FFFFFF;
            border-color: rgba(255, 255, 255, 0.5);
        }
        .btn-outline-light:hover {
            border-color: var(--gold);
            color: var(--gold);
            transform: translateY(-3px);
            background-color: rgba(245, 184, 46, 0.12);
            box-shadow: 0 8px 25px rgba(245, 184, 46, 0.25);
        }

        /* =========================================
           HEADER
           ========================================= */
        header {
            position: fixed; top: 0; left: 0; width: 100%;
            z-index: 1000;
            background-color: var(--header-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: var(--transition);
            padding-top: env(safe-area-inset-top);
        }
        header.scrolled {
            background-color: var(--header-bg-scrolled);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(6, 59, 128, 0.1);
        }
        header::after {
            content: ''; position: absolute; bottom: 0; left: 0;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), var(--bright-blue), transparent);
            opacity: 0; transition: opacity 0.4s ease;
        }
        header.scrolled::after { opacity: 0.7; }

        .header-inner {
            display: flex; justify-content: space-between; align-items: center;
            height: var(--header-h);
            transition: height 0.4s ease;
            gap: 0.5rem;
        }
        header.scrolled .header-inner { height: 70px; }

        .logo {
            display: flex; align-items: center; gap: 0.8rem;
            text-decoration: none; flex-shrink: 1; position: relative;
            padding: 4px 8px; transition: var(--transition);
            min-width: 0; overflow: hidden;
        }
        .logo::before {
            content: ''; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 140%; height: 200%;
            background: radial-gradient(ellipse at center, rgba(245, 184, 46, 0.2) 0%, rgba(8, 120, 209, 0.08) 40%, transparent 70%);
            border-radius: 50%; z-index: -1; pointer-events: none;
            opacity: 0.7; transition: var(--transition);
        }
        .logo:hover::before { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }

        .logo img {
            height: 52px; width: auto;
            transition: height 0.4s ease;
            position: relative; z-index: 1;
            flex-shrink: 0;
        }
        header.scrolled .logo img { height: 42px; }

        .logo-text {
            display: flex; flex-direction: column;
            line-height: 1.1; position: relative; z-index: 1;
            min-width: 0; overflow: hidden;
        }
        .logo-text .brand-name {
            font-family: 'Cairo', sans-serif; font-size: 1.15rem;
            font-weight: 900; color: var(--text-primary);
            letter-spacing: 0.3px; transition: font-size 0.4s ease;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        header.scrolled .logo-text .brand-name { font-size: 1rem; }

        .logo-text .brand-sub {
            font-family: 'Cairo', sans-serif; font-size: 0.65rem;
            font-weight: 700; color: var(--dark-gold);
            letter-spacing: 2px; margin-top: 2px;
            transition: font-size 0.4s ease;
            white-space: nowrap;
        }
        header.scrolled .logo-text .brand-sub { font-size: 0.6rem; }

        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a {
            font-size: 0.9rem; font-weight: 600;
            color: var(--text-secondary); position: relative;
            letter-spacing: 0.3px; padding: 0.5rem 0;
        }
        .nav-links a:hover { color: var(--primary-blue); }
        [data-theme="dark"] .nav-links a:hover { color: var(--gold); }
        .nav-links a::after {
            content: ''; position: absolute; bottom: 0; right: 0;
            width: 0; height: 2px;
            background: linear-gradient(90deg, var(--gold), var(--bright-blue));
            border-radius: 2px; transition: width 0.4s ease;
        }
        .nav-links a:hover::after { width: 100%; }

        .header-actions {
            display: flex; gap: 0.6rem; align-items: center;
            flex-shrink: 0; margin-inline-start: 0.5rem;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.4);
            border: 1.5px solid rgba(6, 59, 128, 0.15);
            color: var(--text-primary);
            width: 42px; height: 42px; border-radius: 12px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: var(--transition); font-size: 0.95rem;
            position: relative; overflow: hidden;
            backdrop-filter: blur(10px); flex-shrink: 0;
            padding: 0;
        }
        [data-theme="dark"] .icon-btn { background: rgba(6, 35, 71, 0.4); }
        .icon-btn:hover {
            border-color: var(--gold);
            color: var(--primary-blue);
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 10px 25px rgba(245, 184, 46, 0.3);
            background-color: var(--accent-gold-light);
        }
        [data-theme="dark"] .icon-btn:hover { color: var(--gold); }

        .lang-btn {
            font-size: 0.75rem; font-weight: 800;
            width: auto; padding: 0 1.2rem;
            border-radius: 25px; gap: 0.5rem; letter-spacing: 0.5px;
        }

        .hamburger {
            display: none; flex-direction: column; gap: 5px;
            cursor: pointer; background: none; border: none;
            padding: 8px; flex-shrink: 0;
            width: 42px; height: 42px;
            align-items: center; justify-content: center;
            border-radius: 12px;
            transition: var(--transition);
        }
        .hamburger:hover { background: rgba(245, 184, 46, 0.1); }
        .hamburger span {
            display: block; width: 24px; height: 2.5px;
            background-color: var(--text-primary);
            transition: var(--transition); border-radius: 2px;
        }

        @media (max-width: 992px) {
            .nav-links { display: none; }
            .hamburger { display: flex; }
            .header-actions .lang-btn span { display: none; }
            .header-actions .lang-btn { width: 42px; padding: 0; border-radius: 12px; }
        }

        @media (max-width: 768px) {
            :root { --header-h: 76px; }
            header.scrolled .header-inner { height: 66px; }
            .header-inner { padding: 0 1rem; gap: 0.4rem; }
            .logo { gap: 0.5rem; padding: 4px 4px; }
            .logo img { height: 46px; }
            header.scrolled .logo img { height: 38px; }
            .logo-text .brand-name { font-size: 0.95rem; }
            header.scrolled .logo-text .brand-name { font-size: 0.85rem; }
            .logo-text .brand-sub { font-size: 0.55rem; letter-spacing: 1.2px; }
            .icon-btn { width: 38px; height: 38px; font-size: 0.85rem; border-radius: 10px; }
            .lang-btn { width: 38px; }
            .header-actions { gap: 0.4rem; margin-inline-start: 0.25rem; }
        }

        @media (max-width: 480px) {
            :root { --header-h: 70px; }
            header.scrolled .header-inner { height: 62px; }
            .header-inner { padding: 0 0.75rem; gap: 0.3rem; }
            .logo { gap: 0.4rem; padding: 2px; }
            .logo img { height: 40px; }
            header.scrolled .logo img { height: 34px; }
            .logo-text .brand-name { font-size: 0.85rem; }
            header.scrolled .logo-text .brand-name { font-size: 0.78rem; }
            .logo-text .brand-sub { display: none; }
            .icon-btn { width: 34px; height: 34px; font-size: 0.78rem; border-radius: 9px; }
            .lang-btn { width: 34px; }
            .hamburger { width: 34px; height: 34px; padding: 6px; }
            .hamburger span { width: 20px; height: 2px; }
            .header-actions { gap: 0.3rem; margin-inline-start: 0.15rem; }
        }

        @media (max-width: 360px) {
            .header-inner { padding: 0 0.5rem; }
            .logo img { height: 36px; }
            .logo-text .brand-name { font-size: 0.75rem; }
            .icon-btn { width: 32px; height: 32px; font-size: 0.72rem; }
            .lang-btn { width: 32px; }
            .hamburger { width: 32px; height: 32px; }
            .hamburger span { width: 18px; height: 2px; }
        }

        .mobile-menu {
            display: none; position: fixed;
            top: calc(var(--header-h) + env(safe-area-inset-top));
            left: 0;
            width: 100%;
            height: calc(100vh - var(--header-h) - env(safe-area-inset-top));
            height: calc(100svh - var(--header-h) - env(safe-area-inset-top));
            background-color: var(--bg-secondary); z-index: 999;
            overflow-y: auto; padding: 2rem 1.5rem;
            border-top: 1px solid var(--border-color);
            animation: slideDown 0.3s ease;
            backdrop-filter: blur(20px);
            -webkit-overflow-scrolling: touch;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .mobile-menu.active { display: block; }
        .mobile-menu ul { display: flex; flex-direction: column; }
        .mobile-menu ul li { border-bottom: 1px solid var(--border-color); }
        .mobile-menu ul li a {
            display: block; padding: 1.2rem 0;
            font-size: 1.05rem; color: var(--text-primary);
            transition: var(--transition); font-weight: 600;
        }
        .mobile-menu ul li a:hover,
        .mobile-menu ul li a:active { color: var(--dark-gold); padding-right: 12px; }
        body[dir="ltr"] .mobile-menu ul li a:hover,
        body[dir="ltr"] .mobile-menu ul li a:active { padding-right: 0; padding-left: 12px; }

        /* =========================================
           HERO — MOBILE-FIRST + BACKGROUND IMAGE
           ========================================= */
        .hero {
            position: relative;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(0, 36, 90, 0.92) 0%, rgba(6, 59, 128, 0.75) 50%, rgba(0, 36, 90, 0.95) 100%);
            margin-top: calc(var(--header-h) * -1);
            padding-top: var(--header-h);
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 0;
            transition: transform 12s ease;
            background-color: var(--dark-blue);
        }
        .hero:hover .hero-bg { transform: scale(1.06); }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(0, 36, 90, 0.88) 0%,
                rgba(6, 59, 128, 0.65) 50%,
                rgba(0, 36, 90, 0.94) 100%
            );
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 950px;
            padding: 4rem 1.25rem 4rem;
            color: #FFFFFF;
            animation: fadeInUp 1.2s ease;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.55rem 1.2rem;
            background: rgba(245, 184, 46, 0.18);
            border: 1px solid rgba(245, 184, 46, 0.45);
            border-radius: 50px;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--gold);
            margin-bottom: 1.5rem;
            letter-spacing: 0.3px;
            backdrop-filter: blur(10px);
            max-width: 100%;
        }
        .hero-badge span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 280px;
        }
        .hero-badge i { font-size: 0.95rem; flex-shrink: 0; }

        .hero-content h1 {
            font-size: clamp(1.9rem, 7vw, 4.5rem);
            margin-bottom: 1.2rem;
            font-weight: 900;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.55);
            line-height: 1.15;
            color: #FFFFFF;
            word-wrap: break-word;
        }

        .hero-content p {
            font-size: clamp(0.92rem, 2.4vw, 1.2rem);
            margin-bottom: 2.2rem;
            opacity: 0.96;
            font-weight: 400;
            max-width: 720px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.85;
            color: #FFFFFF;
            padding: 0 0.5rem;
        }

        .hero-buttons {
            display: flex;
            gap: 0.85rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            .hero-content { padding: 3rem 1rem 3rem; }
            .hero-badge { font-size: 0.72rem; padding: 0.45rem 0.9rem; margin-bottom: 1.2rem; }
            .hero-badge span { max-width: 200px; }
            .hero-content h1 { margin-bottom: 1rem; }
            .hero-content p { margin-bottom: 1.8rem; line-height: 1.75; }
        }

        @media (max-width: 480px) {
            .hero-content { padding: 2.5rem 0.9rem 2.5rem; }
            .hero-badge { font-size: 0.68rem; padding: 0.4rem 0.8rem; }
            .hero-badge span { max-width: 160px; }
            .hero-buttons {
                flex-direction: column;
                align-items: stretch;
                gap: 0.7rem;
                width: 100%;
                max-width: 320px;
                margin: 0 auto;
            }
            .hero-buttons .btn { width: 100%; padding: 0.95rem 1.5rem; font-size: 0.88rem; }
        }

        @media (max-width: 360px) {
            .hero-content h1 { font-size: 1.65rem; }
            .hero-content p { font-size: 0.88rem; }
            .hero-badge span { max-width: 130px; }
        }

        @media (hover: none) {
            .hero:hover .hero-bg { transform: none; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* =========================================
           STATS BAR
           ========================================= */
        .stats-bar {
            background: linear-gradient(135deg, var(--dark-blue), var(--primary-blue));
            padding: 2.5rem 0; position: relative; overflow: hidden;
        }
        @media (max-width: 480px) { .stats-bar { padding: 1.8rem 0; } }

        .stats-bar::before {

        /* =========================================

        .sector-card::before {

        .vmv-card {

        .vmv-card::before {
            content: ''; position: absolute; top: 0; left: 0;

            background: linear-gradient(90deg, var(--gold), var(--bright-blue));
            transform: scaleX(0); transform-origin: right;
            transition: transform 0.6s ease;
        }
        .vmv-card:hover::before { transform: scaleX(1); }
        .vmv-card:hover {
            border-color: var(--accent-gold-border);
            transform: translateY(-10px);

        .vmv-icon-wrap {

            border-radius: 50%; margin: 0 auto 1.8rem;

        @media (max-width: 992px) { .vmv-grid { grid-template-columns: 1fr; } }
        @media (max-width: 480px) {

            border-color: var(--accent-gold-border);
            transform: translateY(-10px);
            box-shadow: var(--card-shadow-hover);
        }

            width: 60px; height: 60px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, var(--accent-gold-light), rgba(8, 120, 209, 0.1));

        }
        @media (max-width: 576px) {
            .how-work-grid { grid-template-columns: 1fr; gap: 1rem; }

        /* =========================================
           PRESENCE
           ========================================= */
        .presence-grid {

            max-width: 700px; margin: 0 auto;
        }
        .presence-card {
            background-color: var(--bg-secondary);

            padding: 3rem 2rem; text-align: center; position: relative;

            border-radius: 20px; box-shadow: var(--card-shadow); text-align: center;
        }
        .detail-item::before {
            content: ''; position: absolute; top: 0; left: 0;
            width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--gold), var(--bright-blue));
            border-radius: 20px 20px 0 0;
            transform: scaleX(0); transition: transform 0.5s ease;

           ========================================= */

            content: ''; position: absolute; top: 0; left: 0;

        /* =========================================

                <div class="logo-text" style="display:flex;">
                    <span class="brand-name">${companyName}</span>
                    <span class="brand-sub">AL-BARIQ AL-LAMIE</span>
                </div>
            `;

            // Nav
            const navItems = [
                { href: "#home", text: t.navHome },
                { href: "#sectors", text: t.navSectors },
                { href: "#about", text: t.navAbout },
                { href: "#how-we-work", text: t.navHow },
                { href: "#presence", text: t.navPresence },
                { href: "#contact", text: t.navContact }
            ];
            document.getElementById('desktopNav').innerHTML = navItems.map(i => `<a href="${i.href}">${i.text}</a>`).join('');
            document.getElementById('mobileNavList').innerHTML = navItems.map(i => `<li><a href="${i.href}" class="mobile-link">${i.text}</a></li>`).join('');

            // Hero background (single image, safe fallback)
            const heroBg = document.getElementById('heroBg');
            if (SITE_CONFIG.images.hero && SITE_CONFIG.images.hero.trim() !== "") {
                heroBg.src = SITE_CONFIG.images.hero;
                heroBg.style.display = 'block';
                heroBg.setAttribute('fetchpriority', 'high');
                heroBg.setAttribute('decoding', 'async');
            } else {
                heroBg.style.display = 'none';
            }

            document.getElementById('heroBadge').textContent = t.heroBadge;
            document.getElementById('heroTitle').textContent = t.heroTitle;
            document.getElementById('heroDesc').textContent = t.heroDesc;
            document.getElementById('heroBtn1').textContent = t.heroBtn1;
            document.getElementById('heroBtn2').textContent = t.heroBtn2;

            // Stats
            document.getElementById('statsGrid').innerHTML = t.stats.map(s => `
                <div class="stat-item">
                    <div class="stat-icon"><i class="fas ${s.icon}"></i></div>
                    <div class="stat-label">${s.label}</div>
                </div>
            `).join('');

            // Sectors
            document.getElementById('sectorsTitle').textContent = t.sectorsTitle;
            document.getElementById('sectorsSubtitle').textContent = t.sectorsSubtitle;
            document.getElementById('sectorsGrid').innerHTML = t.sectors.map(s => `
                <div class="sector-card reveal">
                    <div class="sector-header">
                        <div class="sector-icon-wrap"><i class="fas ${s.icon}"></i></div>
                        <div class="sector-title">
                            <h3>${s.nameAr}</h3>
                            <div class="sector-en">${s.nameEn}</div>
                        </div>
                    </div>
                    <p class="sector-desc">${s.desc}</p>
                    <div class="sector-features">
                        ${s.features.map(f => `<span>${f}</span>`).join('')}
                    </div>
                </div>
            `).join('');

            // About (text only)
            document.getElementById('aboutTitle').textContent = t.aboutTitle;
            document.getElementById('aboutP1').textContent = t.aboutP1;
            document.getElementById('aboutP2').textContent = t.aboutP2;

            // VMV
            document.getElementById('visionTitle').textContent = t.visionTitle;
            document.getElementById('visionText').textContent = t.visionText;
            document.getElementById('missionTitle').textContent = t.missionTitle;
            document.getElementById('missionText').textContent = t.missionText;
            document.getElementById('valuesTitle').textContent = t.valuesTitle;
            document.getElementById('valuesList').innerHTML = t.values.map(v => `<span>${v}</span>`).join('');

            // How We Work
            document.getElementById('howTitle').textContent = t.howTitle;
            document.getElementById('howSubtitle').textContent = t.howSubtitle;
            document.getElementById('step1Title').textContent = t.step1Title;
            document.getElementById('step1Desc').textContent = t.step1Desc;
            document.getElementById('step2Title').textContent = t.step2Title;
            document.getElementById('step2Desc').textContent = t.step2Desc;
            document.getElementById('step3Title').textContent = t.step3Title;
            document.getElementById('step3Desc').textContent = t.step3Desc;
            document.getElementById('step4Title').textContent = t.step4Title;
            document.getElementById('step4Desc').textContent = t.step4Desc;

            // Presence
            document.getElementById('presenceTitle').textContent = t.presenceTitle;
            document.getElementById('presenceGrid').innerHTML = t.presence.map(p => `
                <div class="presence-card reveal">
                    <div class="presence-info">
                        <div class="presence-icon"><i class="fas fa-map-marker-alt"></i></div>
                        <h3>${p.city}</h3>
                        <div class="sub">${p.sub}</div>
                        <p>${p.desc}</p>
                    </div>
                </div>
            `).join('');

            // Details
            document.getElementById('detailHoursTitle').textContent = t.detailHoursTitle;
            document.getElementById('detailHoursText').textContent = t.detailHoursText;
            document.getElementById('detailCoverageTitle').textContent = t.detailCoverageTitle;
            document.getElementById('detailCoverageText').textContent = t.detailCoverageText;
            document.getElementById('detailPartnersTitle').textContent = t.detailPartnersTitle;
            document.getElementById('detailPartnersText').textContent = t.detailPartnersText;

            // Contact
            document.getElementById('contactTitle').textContent = t.contactTitle;
            document.getElementById('contactDesc').textContent = t.contactDesc;
            document.getElementById('contactGrid').innerHTML = SITE_CONFIG.phones.map(phone => `
                <div class="contact-card reveal">
                    <div class="contact-icon"><i class="fas fa-phone-alt"></i></div>
                    <div class="contact-number">${phone.display}</div>
                    <div class="contact-buttons">
                        <a href="tel:${phone.number}" class="btn btn-primary">
                            <i class="fas fa-phone"></i> ${t.contactBtnCall}
                        </a>
                        <a href="https://wa.me/${phone.whatsapp}" target="_blank" rel="noopener noreferrer" class="btn btn-outline">
                            <i class="fab fa-whatsapp"></i> ${t.contactBtnWhatsapp}
                        </a>
                    </div>
                </div>
            `).join('');

            document.getElementById('contactMapLink').href = SITE_CONFIG.locationLink;
            document.getElementById('contactMapText').textContent = t.contactMapText;

            // Footer
            document.getElementById('footerLogo').textContent = companyName;
            document.getElementById('footerSub').textContent = currentLang === 'ar' ? 'AL-BARIQ AL-LAMIE ENTITY' : 'كيان البريق اللامع';
            document.getElementById('footerDesc').textContent = t.footerDesc;
            document.getElementById('footerNavTitle').textContent = t.footerNavTitle;
            document.getElementById('footerServicesTitle').textContent = t.footerServicesTitle;
            document.getElementById('footerCopyright').textContent = t.footerCopyright;

            document.getElementById('footerNavList').innerHTML = navItems.map(i => `<li><a href="${i.href}">${i.text}</a></li>`).join('');
            document.getElementById('footerServicesList').innerHTML = t.sectors.map(s => `<li><a href="#sectors">${s.nameAr}</a></li>`).join('');

            initScrollReveal();
        }

        function initMobileMenu() {
            const menuBtn = document.getElementById('mobileMenuBtn');
            const mobileMenu = document.getElementById('mobileMenu');

            menuBtn.addEventListener('click', () => {
                mobileMenu.classList.toggle('active');
                const spans = menuBtn.querySelectorAll('span');
                if (mobileMenu.classList.contains('active')) {
                    spans[0].style.transform = 'rotate(45deg) translate(5px, 5px)';
                    spans[1].style.opacity = '0';
                    spans[2].style.transform = 'rotate(-45deg) translate(5px, -5px)';
                } else {
                    spans[0].style.transform = 'none';
                    spans[1].style.opacity = '1';
                    spans[2].style.transform = 'none';
                }
            });

            mobileMenu.addEventListener('click', (e) => {
                if (e.target.tagName === 'A') {
                    mobileMenu.classList.remove('active');
                    const spans = menuBtn.querySelectorAll('span');
                    spans[0].style.transform = 'none';
                    spans[1].style.opacity = '1';
                    spans[2].style.transform = 'none';
                }
            });
        }

        function initScrollReveal() {
            const reveals = document.querySelectorAll('.reveal');
            const revealObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                        revealObserver.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
            reveals.forEach(reveal => revealObserver.observe(reveal));
        }

        function initSmoothScroll() {
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function(e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        const headerOffset = 85;
                        const elementPosition = target.getBoundingClientRect().top;
                        const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
                        window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
                    }
                });
            });
        }

        function initHeaderScroll() {
            const header = document.getElementById('mainHeader');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 50) header.classList.add('scrolled');
                else header.classList.remove('scrolled');
            }, { passive: true });
        }

        document.getElementById('themeToggle').addEventListener('click', toggleTheme);
        document.getElementById('langToggle').addEventListener('click', toggleLanguage);

        window.addEventListener('resize', () => {
            if (window.innerWidth > 992) {
                const mobileMenu = document.getElementById('mobileMenu');
                if (mobileMenu.classList.contains('active')) {
                    mobileMenu.classList.remove('active');
                    const spans = document.querySelector('#mobileMenuBtn').querySelectorAll('span');
                    spans[0].style.transform = 'none';
                    spans[1].style.opacity = '1';
                    spans[2].style.transform = 'none';
                }
            }
        });
    </script>
</body>
</html>
